<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineQuiz - Ultimate Cinema Trivia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark sticky-top navbar-blur py-3">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                    <i class="fa-solid fa-film text-danger"></i>
                    <span>Cine</span>Quiz
                </a>
                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="./index.html">Home</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Categories
                            </a>
                            <ul class="dropdown-menu dropdown-menu-dark bg-dark border-danger">
                                <li><a class="dropdown-item" href="#categories"><i
                                            class="fa-solid fa-masks-theater me-2 text-warning"></i>Bollywood
                                        Classics</a></li>
                                <li><a class="dropdown-item" href="#categories"><i
                                            class="fa-solid fa-compact-disc me-2 text-danger"></i>90s Nostalgia</a></li>
                                <li><a class="dropdown-item" href="#categories"><i
                                            class="fa-solid fa-fire me-2 text-warning"></i>Blockbusters & Action</a>
                                </li>
                                <li><a class="dropdown-item" href="#categories"><i
                                            class="fa-solid fa-user-ninja me-2 text-info"></i>Actors & Actresses</a>
                                </li>
                                <li><a class="dropdown-item" href="#categories"><i
                                            class="fa-solid fa-music me-2 text-success"></i>Music & Lyrics</a></li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#quiz-widget">Daily Challenge</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#leaderboard">Leaderboard</a>
                        </li>
                    </ul>
                    <form class="d-flex" role="search">
                        <button class="btn btn-outline-danger" type="submit">Search</button>
                    </form>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="quizdetails d-none" id="quizdetails">
            <div class="container my-5">
                <div class="hero-main-card rounded-4">
                    <div class="card-header glow-title py-2 display-6 m-3" id="cardHeader"></div>
                    <div class="card-body">
                        <span id="totalQuestions" class="mx-4 text-secondary font-awesome"></span>
                        <p id="cardTime" class="mx-4 my-1 text-secondary font-awesome"></p>
                        <p class="card-title fw-semibold fs-5" id="cardterm"></p>
                        <button class="btn btn-danger my-4 mx-4">
                            <a href="#" class="btn btn-danger" id="cardButton">Play Quiz</a>
                        </button>
                    </div>
                </div>
            </div>
        </section>
        <section class="quizQuestions" id="quizQuestioncard">
            <div class="container">
                <div class="hero-main-card rounded-4 quizheader">
                    <div class="hero-main-card quizheader m-3 p-3 rounded-3 d-flex justify-content-between">
                        <div class="card-header" id="questionCounter">
                        </div>
                        <div class="card-header" id="timer">
                            time left : 180s
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mx-5">
                            <div class="card-header glow-title fw-semibold fs-4" id="quizHeader">
                            </div>
                            <div class="card-header" id="currentScore">
                                current Score: 0
                            </div>
                        </div>
                        <p class="card-text text-center fs-5 m-3" id="quizQuestions"></p>
                        <button type="button" class="btn btn-outline-danger m-3 justify-content-between"
                            id="quizOption"></button>
                        <div class="progress m-4">
                            <div class="progress-bar" role="progressbar" id="progressBar"></div>
                        </div>
                        <div class="d-flex justify-content-between">
                            <button type="button" class="btn btn-outline-danger m-3 justify-content-between rounded-3"
                                id="quizOption">previous</button>
                            <button type="button" class="btn btn-outline-danger m-3 justify-content-between rounded-3"
                                id="quizOption">next</button>
                        </div>
                    </div>
                </div>
            </div>

        </section>
    </main>
    <script src="./js/data.js"></script>
    <script src="./js/play.js"></script>
</body>

</html>
